name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly tier, with the Windows jobs and Stress
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    permissions:
      contents: read
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false
      test-job: true
      single-job: false
      affected-tests: true
      nightly: ${{ inputs.nightly == true }}
      formal-checks: |
        [
          {"skill": "formal-add-sub-contract", "paths": ["src/implementations/database/expression.ts", "src/implementations/database/query.ts"]},
          {"skill": "formal-conflict-insert-race", "paths": ["src/connection.ts", "src/implementations/database/conflict-upsert.ts", "src/implementations/database/indexes.ts", "src/implementations/database/query.ts", "src/implementations/database/selection.ts"]},
          {"skill": "formal-cursor-close", "paths": ["src/connection.ts", "src/implementations/database/instance-scope.ts", "src/implementations/database/pipeline-core.ts", "src/implementations/database/query.ts"]},
          {"skill": "formal-group-mapper", "paths": ["src/implementations/database/group-field.ts", "src/implementations/database/pipeline-core.ts", "src/implementations/database/pipeline.ts", "src/implementations/database/query.ts", "src/implementations/database/selection.ts"]},
          {"skill": "formal-query-index-rebuild", "paths": ["src/connection.ts", "src/implementations/database/query.ts", "src/implementations/database/schema.ts", "src/implementations/database/selection.ts", "src/schema-initialization.ts"]}
        ]
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
  verdict:
    needs: [ci, renovate-sync]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
