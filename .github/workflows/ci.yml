name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@8c79f96b4f7f374ebb9346cfd0b8a182ee92fb9b # v2
    permissions:
      contents: read
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false
      extra-commands: |
        node .agents/skills/formal-query-index-rebuild/check.mjs
        node .agents/skills/formal-conflict-insert-race/check.mjs
        node .agents/skills/formal-cursor-close/check.mjs
        node .agents/skills/formal-add-sub-contract/check.mjs
        node .agents/skills/formal-group-mapper/check.mjs
      test-job: true
      single-job: false
      affected-tests: true
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@8c79f96b4f7f374ebb9346cfd0b8a182ee92fb9b # v2
